name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

# Même toolchain que les fils rouges (rust-toolchain.toml, 1.90.0).
jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain épinglée (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
