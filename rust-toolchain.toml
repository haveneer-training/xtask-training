# Même version que les fils rouges qui s'en servent : le minimum du programme de la
# formation (Rust ≥ 1.90, `rust-version`). Ne la monter qu'avec eux.
[toolchain]
channel = "1.90.0"
# `rust-analyzer` : l'extension VS Code cherche le serveur dans la toolchain épinglée
components = ["rustfmt", "clippy", "rust-analyzer"]
profile = "minimal"
